name: Build TrackLess APK

on:
  workflow_dispatch:
  push:
    branches: [main, feature/modernize-kotlin-datastore]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Gradle
        run: ./gradlew assembleDebug > build_output.txt 2>&1 || true
      - name: Commit build output
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add build_output.txt
          git commit -m "chore: save build output" || true
          git push
