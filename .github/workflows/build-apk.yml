name: Build TrackLess APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build and publish TrackLess APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrackLess-v1.2.4
          path: app/build/outputs/apk/release/TrackLess-v*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.2.4 >/dev/null 2>&1; then
            gh release upload v1.2.4 app/build/outputs/apk/release/TrackLess-v1.2.4.apk --clobber
          else
            gh release create v1.2.4 \
              app/build/outputs/apk/release/TrackLess-v1.2.4.apk \
              --title "TrackLess v1.2.4" \
              --notes "First public release of TrackLess."
          fi
