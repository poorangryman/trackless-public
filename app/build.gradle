plugins {
    id 'com.android.application'
}

def tracklessVersionName = '1.2.4'

android {
    namespace = 'ru.otvykaniye.tracker'
    compileSdk = 35

    defaultConfig {
        applicationId = 'ru.otvykaniye.tracker'
        minSdk = 23
        targetSdk = 35
        versionCode = 8
        versionName = tracklessVersionName
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled = false
            debuggable = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

tasks.matching { it.name == 'assembleRelease' }.configureEach {
    doLast {
        def releaseDir = file("$buildDir/outputs/apk/release")
        def sourceApk = file("$releaseDir/app-release.apk")
        def namedApk = file("$releaseDir/TrackLess-v${tracklessVersionName}.apk")
        if (sourceApk.exists() && sourceApk.absolutePath != namedApk.absolutePath) {
            copy {
                from sourceApk
                into releaseDir
                rename { namedApk.name }
            }
        }
    }
}
