plugins {
    id 'com.android.application'
}

def tracklessVersionName = '1.2.4'

def hasReleaseSigning = System.getenv('TRACKLESS_KEYSTORE_PATH') &&
        System.getenv('TRACKLESS_KEYSTORE_PASSWORD') &&
        System.getenv('TRACKLESS_KEY_ALIAS') &&
        System.getenv('TRACKLESS_KEY_PASSWORD')

android {
    namespace = 'ru.otvykaniye.tracker'
    compileSdk = 35

    defaultConfig {
        applicationId = 'ru.otvykaniye.tracker'
        minSdk = 23
        targetSdk = 35
        versionCode = 8
        versionName = tracklessVersionName
    }

    if (hasReleaseSigning) {
        signingConfigs {
            tracklessRelease {
                storeFile = file(System.getenv('TRACKLESS_KEYSTORE_PATH'))
                storePassword = System.getenv('TRACKLESS_KEYSTORE_PASSWORD')
                keyAlias = System.getenv('TRACKLESS_KEY_ALIAS')
                keyPassword = System.getenv('TRACKLESS_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            // Standard Android debug signing is used automatically.
        }
        release {
            minifyEnabled = false
            debuggable = false
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.tracklessRelease
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

tasks.matching { it.name == 'assembleRelease' }.configureEach {
    doLast {
        def releaseDir = file("$buildDir/outputs/apk/release")
        def sourceApk = file("$releaseDir/app-release.apk")
        def versionFile = rootProject.file('VERSION.txt')
        def version = versionFile.exists() && versionFile.text.trim()
                ? versionFile.text.trim()
                : tracklessVersionName
        def namedApk = file("$releaseDir/TrackLess-v${version}.apk")

        if (sourceApk.exists() && sourceApk.absolutePath != namedApk.absolutePath) {
            copy {
                from sourceApk
                into releaseDir
                rename { namedApk.name }
            }
        }
    }
}
