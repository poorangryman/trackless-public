plugins {
    id 'com.android.application'
}

def versionFile = rootProject.file('VERSION.txt')
def tracklessVersionName = versionFile.exists() && versionFile.text.trim()
        ? versionFile.text.trim()
        : '1.2.5'

def hasReleaseSigning = System.getenv('TRACKLESS_KEYSTORE_PATH') &&
        System.getenv('TRACKLESS_KEYSTORE_PASSWORD') &&
        System.getenv('TRACKLESS_KEY_ALIAS') &&
        System.getenv('TRACKLESS_KEY_PASSWORD')

android {
    namespace = 'ru.otvykaniye.tracker'
    compileSdk = 35

    defaultConfig {
        applicationId = 'ru.otvykaniye.tracker'
        minSdk = 23
        targetSdk = 35
        versionCode = 9
        versionName = tracklessVersionName
    }

    if (hasReleaseSigning) {
        signingConfigs {
            tracklessRelease {
                storeFile = file(System.getenv('TRACKLESS_KEYSTORE_PATH'))
                storePassword = System.getenv('TRACKLESS_KEYSTORE_PASSWORD')
                keyAlias = System.getenv('TRACKLESS_KEY_ALIAS')
                keyPassword = System.getenv('TRACKLESS_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            // Standard Android debug signing is used automatically.
        }
        release {
            minifyEnabled = false
            debuggable = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.tracklessRelease
            } else {
                // Fallback: use the default debug signing so the APK is always
                // installable.  This makes local builds and CI without secrets
                // produce an APK that Android will accept.
                signingConfig = signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

tasks.matching { it.name == 'assembleRelease' }.configureEach {
    doLast {
        def releaseDir = file("$buildDir/outputs/apk/release")
        def version = tracklessVersionName
        def namedApk = file("$releaseDir/TrackLess-v${version}.apk")

        // The output APK name varies depending on whether signing is configured.
        def candidates = ['app-release.apk', 'app-release-unsigned.apk']
        def sourceApk = candidates.collect { file("$releaseDir/$it") }
                .find { it.exists() && it.absolutePath != namedApk.absolutePath }

        if (sourceApk != null) {
            copy {
                from sourceApk
                into releaseDir
                rename { namedApk.name }
            }
        }
    }
}
